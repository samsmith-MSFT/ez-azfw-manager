# Wraps the app that Electron Forge already built and hardened (`electron-forge package`) into
# single-file executables. Run through `npm run dist`, which passes --prepackaged.
# Retain the original appId so installers upgrade existing installations.
appId: com.samsmithmsft.ezazfwruleman
productName: EZ AzFW Manager
copyright: Copyright (c) 2026 samsmith-MSFT
# Must match Forge's executable name; Windows overrides this with the friendly product name.
executableName: ez-azfw-manager
artifactName: ez-azfw-manager-${version}-${os}-${arch}.${ext}
directories:
  output: out/release
publish: null

win:
  # NSIS also uses this name for its default Program Files directory and shortcut target.
  executableName: EZ AzFW Manager
  # An installer (Start menu and desktop shortcuts, uninstaller) plus the portable single file.
  target:
    - nsis
    - portable
  icon: assets/icons/icon.ico
  # Keep the executable exactly as Forge produced it (fuses, metadata, optional signature).
  signAndEditExecutable: false

nsis:
  artifactName: ez-azfw-manager-${version}-win-${arch}-setup.${ext}
  # Standard install: asks for administrator rights, then installs for all users under
  # C:\Program Files by default (the wizard lets people pick another folder or drive).
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EZ AzFW Manager
  runAfterFinish: true
  # Drafts, history and sign-in live in %APPDATA%\ez-azfw-ruleman; uninstalling keeps them.
  deleteAppDataOnUninstall: false

portable:
  artifactName: ez-azfw-manager-${version}-win-${arch}-portable.${ext}
  # Unpack to a stable folder so later launches start faster.
  unpackDirName: ez-azfw-manager

linux:
  target: AppImage
  icon: assets/icons/icon.png
  category: Development
  synopsis: Manage Azure Firewall policy rules with a draft and commit workflow

mac:
  target: zip
  icon: assets/icons/icon.icns
  category: public.app-category.developer-tools
  # Forge already signs and notarizes the .app when credentials are set; never re-sign it.
  identity: null
